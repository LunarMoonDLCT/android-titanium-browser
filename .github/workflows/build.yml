name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest'
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    
    timeout-minutes: 360 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update Submodule/Vanadium
        run: |
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          git add vanadium
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --quiet; then
            git commit -am "update"
            git push || true
          fi
      - name: Setup ccache
        uses: hendrikmi/ccache-action@vv1.2
        with:
          key: chromium-android-${{ env.VERSION }}
          max-size: 10G

      - name: Set ENV
        run: | 
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV
          # Đảm bảo ninja sử dụng hết số core của runner
          echo "NINJA_FLAGS=-j$(nproc)" >> $GITHUB_ENV

      - name: Build
        env:
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
          CCACHE_COMPRESS: "true"
          CCACHE_MAXSIZE: "10G"
          CCACHE_SLOPPINESS: include_file_mtime,time_macros
        run: |
          # Nếu script build.sh của bạn gọi ninja, hãy chắc chắn nó truyền biến NINJA_FLAGS vào
          # Ví dụ trong build.sh: ninja -C out/release $NINJA_FLAGS chrome_public_apk
          ./build.sh

      - name: Set Output Version & Files
        run: |
          export VERSION=$(find chromium/src/out/release -name '*armeabi-v7a.apk' | head -n 1 | sed 's/.*\///;s/\-armeabi-v7a.apk$//')
          if [ -z "$VERSION" ]; then
            export VERSION=$(find chromium/src/out/release -name '*arm64-v8a.apk' | head -n 1 | sed 's/.*\///;s/\-arm64-v8a.apk$//')
          end
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          mv $(find chromium/src/out/release -name '*arm64-v8a.aab') $VERSION-${{ env.unix_time }}-arm64-v8a.aab || true
          mv $(find chromium/src/out/release -name '*arm64-v8a.apk') $VERSION-${{ env.unix_time }}-arm64-v8a.apk || true
          mv $(find chromium/src/out/release -name '*armeabi-v7a.apk') $VERSION-${{ env.unix_time }}-armeabi-v7a.apk || true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            ${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            ${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk
